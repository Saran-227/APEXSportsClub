services:
  postgres:
    image: postgres:16-alpine
    container_name: scms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sports_club_db}
      POSTGRES_USER: ${POSTGRES_USER:-scms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scms_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scms_user} -d ${POSTGRES_DB:-sports_club_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - scms_network

volumes:
  postgres_data:
    name: scms_postgres_data
    driver: local

networks:
  scms_network:
    name: scms_network
    driver: bridge
